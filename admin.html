<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskMoon Admin 🌙</title>

<style>
body{
  margin:0;
  background:#061415;
  color:#fff;
  font-family:Arial;
  padding:16px;
}

h1{
  color:#42e0d1;
}

.card{
  background:#0b2223;
  border:1px solid #153f40;
  border-radius:14px;
  padding:15px;
  margin:12px 0;
}

input,textarea,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:9px;
  border:0;
  box-sizing:border-box;
}

input,textarea{
  background:#102728;
  color:#fff;
  border:1px solid #285455;
}

textarea{
  min-height:80px;
  resize:vertical;
}

button{
  background:#123f40;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.uid{
  color:#42e0d1;
  font-weight:bold;
}

.reply{
  background:#0e3031;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>🌙 TaskMoon Admin</h1>

<div class="card">
  <h3>🔐 Admin Login</h3>

  <input
    id="adminId"
    type="number"
    placeholder="Admin ID"
  >
  <button id="loadBtn" type="button" onclick="loadChats()">
    📥 Load Chats
  </button>

  <button id="logoutBtn" type="button" style="display:none;">
    🚪 Logout Admin
  </button>


</div>

<div id="chatList"></div>
<div class="card" style="margin-top:15px;">
  <h3>👥 Users</h3>

  <div id="totalUsers"
       style="font-size:22px;font-weight:bold;margin:10px 0;">
    Total Users: —
  </div>

  <button id="loadUsersBtn" type="button">
    👥 Load Users
  </button>

  <div id="usersSection" style="margin-top:10px;"></div>
</div>



<script>

const API = "https://taskmoon-backend.onrender.com";
const savedAdminId = localStorage.getItem("taskmoon_admin_id");
let currentAdminId = savedAdminId || "";



if(savedAdminId === "7136507076"){
  document.getElementById("adminId").value = savedAdminId;
  document.getElementById("logoutBtn").style.display = "block";
}



document.getElementById("logoutBtn").addEventListener("click", function(){
  localStorage.removeItem("taskmoon_admin_id");
  document.getElementById("adminId").value = "";
  document.getElementById("logoutBtn").style.display = "none";
  document.getElementById("chatList").innerHTML = "";
  currentAdminId = "";
  alert("✅ Admin Logout হয়েছে");
});


async function loadChats(){

  const adminId =
    document.getElementById("adminId").value.trim();

  if(adminId !== "7136507076"){
    alert("❌ Unauthorized Admin");
    return;
  }

  currentAdminId = adminId;
  localStorage.setItem("taskmoon_admin_id", adminId);
  document.getElementById("logoutBtn").style.display = "block";

  const list =
    document.getElementById("chatList");

  list.innerHTML =
    "<div class='card'>⏳ Loading chats...</div>";

  try{

    const response = await fetch(
      API +
      "/admin/support/chats?admin_id=" +
      encodeURIComponent(adminId)
    );

    const data = await response.json();

    if(!response.ok){

      list.innerHTML =
        "<div class='card'>❌ " +
        (data.error || "Server Error") +
        "</div>";

      return;
    }

    if(!Array.isArray(data) || data.length === 0){

      list.innerHTML =
        "<div class='card'>📭 এখন কোনো Live Chat নেই।</div>";

      return;
    }

    list.innerHTML = data.map(chat => `

      <div class="card">

        <div class="uid">
          🆔 UID: ${escapeHtml(chat.uid)}
        </div>

        <p>
          👤 User ID: ${escapeHtml(String(chat.user_id))}
        </p>

        <p>
          📋 Problem: ${escapeHtml(chat.problem)}
        </p>

        <div
          id="conversation-${chat.id}"
          class="conversation"
        >
          💬 Loading conversation...
        </div>

        <p>
          🟢 Status: ${escapeHtml(chat.status)}
        </p>

        <small>
          🕒 ${escapeHtml(chat.created_at)}
        </small>

        ${
          chat.status === "open"
          ?
          `
          <textarea
            id="reply-${chat.id}"
            placeholder="✍️ এখানে Reply লিখুন..."
          ></textarea>

          <button
            type="button"
            data-chat-id="${chat.id}"
            class="replyBtn"
          >
            📤 Send Reply
          </button>
          `
          :
          `<p>🔒 Chat Closed</p>`
        }

      </div>

    `).join("");

    data.forEach(chat => {
      loadConversation(chat.id);
    });

    document.querySelectorAll(".replyBtn").forEach(button => {

      button.addEventListener("click", function(){

        const chatId =
          Number(this.dataset.chatId);

        sendReply(chatId);

      });

    });

  }catch(error){

    console.error(error);

    list.innerHTML =
      "<div class='card'>❌ Server connection failed.</div>";

  }
}


async function loadConversation(chatId){
  const box = document.getElementById("conversation-" + chatId);

  if(!box) return;

  try{
    const response = await fetch(
      API +
      "/admin/support/messages/" +
      chatId +
      "?admin_id=" +
      encodeURIComponent(currentAdminId)
    );

    const data = await response.json();

    if(!response.ok || !data.success){
      box.innerHTML = "❌ Conversation load failed.";
      return;
    }

    if(!Array.isArray(data.messages) || data.messages.length === 0){
      box.innerHTML = "📭 এখনো কোনো message নেই।";
      return;
    }

    box.innerHTML = data.messages.map(item => {
      const isAdmin = item.sender === "admin";

      return `
        <div class="message">
          <strong>
            ${isAdmin ? "👨‍💼 Support" : "👤 User"}
          </strong>
          <div>
            ${escapeHtml(item.message)}
          </div>
          <small>
            ${escapeHtml(item.created_at || "")}
          </small>
        </div>
      `;
    }).join("");

  }catch(error){
    console.error(error);
    box.innerHTML = "❌ Server connection failed.";
  }
}


async function sendReply(chatId){

  const textarea =
    document.getElementById("reply-" + chatId);

  const reply =
    textarea.value.trim();

  if(!reply){

    alert("⚠️ আগে Reply লিখুন।");
    return;
  }

  try{

    const response = await fetch(
      API + "/admin/support/reply",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          admin_id:Number(currentAdminId),
          chat_id:chatId,
          reply:reply
        })
      }
    );

    const data =
      await response.json();

    if(!response.ok || !data.success){

      alert(
        "❌ Reply পাঠানো যায়নি.\n" +
        (data.error || "Unknown error")
      );

      return;
    }

    alert("✅ Admin Reply Sent!");

    loadChats();

  }catch(error){

    console.error(error);

    alert(
      "❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।"
    );

  }
}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


document.getElementById("loadUsersBtn").addEventListener("click", loadUsers);

async function loadUsers(){

  const adminId = document.getElementById("adminId").value.trim();

  if(adminId !== "7136507076"){
    alert("❌ আগে Admin Login করুন");
    return;
  }

  const section = document.getElementById("usersSection");

  section.innerHTML =
    "<div class='card'>⏳ Loading users...</div>";

  try{

    const response = await fetch(
      API +
      "/admin/users?admin_id=" +
      encodeURIComponent(adminId)
    );

    const data = await response.json();

    if(!response.ok || !data.success){
      section.innerHTML =
        "<div class='card'>❌ " +
        (data.error || "Server Error") +
        "</div>";
      return;
    }

    document.getElementById("totalUsers").textContent =
      "👥 Total Users: " + data.total_users;

    if(!data.users || data.users.length === 0){
      section.innerHTML =
        "<div class='card'>📭 কোনো User পাওয়া যায়নি।</div>";
      return;
    }

    let html = "";

    data.users.forEach((user, index) => {
      const currentBalance = Number(user.coins ?? 0);

      html += `
        <div class="card" style="margin-top:8px;">
          <b>#${index + 1}</b><br>
          👤 Name:
          ${escapeHtml(user.first_name || "No Name")}<br>
          🔗 Username:
          ${user.username
            ? "@" + escapeHtml(user.username)
            : "No Username"}<br>
          🆔 User ID:
          ${escapeHtml(user.user_id)}<br>
          🔰 UID:
          ${escapeHtml(user.uid || "No UID")}<br>
          🪙 Current Balance:
          ${escapeHtml(String(currentBalance))} Coins<br>
          🕐 Joined:
          ${escapeHtml(user.created_at || "")}
        </div>
      `;

    });

    section.innerHTML = html;

  }catch(error){

    console.error(error);

    section.innerHTML =
      "<div class='card'>❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।</div>";
  }
}
</script>



<div class="card" style="margin-top:15px;">
  <h3>💸 Withdrawals <span id="pendingWithdrawalBadge" style="display:none;margin-left:8px;padding:3px 9px;border-radius:12px;background:#ff3b30;color:white;font-size:12px;">0 Pending</span></h3>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    <button type="button" onclick="loadWithdrawals('pending')">
      ⏳ Pending
    </button>
    <button type="button" onclick="loadWithdrawals()">
      📋 All
    </button>
    <button type="button" onclick="loadWithdrawals('approved')">
      ✅ Approved
    </button>
    <button type="button" onclick="loadWithdrawals('rejected')">
      ❌ Rejected
    </button>
  </div>

  <div id="withdrawalList" style="margin-top:12px;">
    <div>📭 Withdrawal load করা হয়নি।</div>
  </div>
</div>

<script>
async function loadWithdrawals(status = "pending") {

  const adminId = document.getElementById("adminId").value.trim();

  if (adminId !== "7136507076") {
    alert("❌ আগে Admin Login করুন");
    return;
  }

  const list = document.getElementById("withdrawalList");

  list.innerHTML =
    "<div class='card'>⏳ Loading withdrawals...</div>";

  try {

    let url =
      API +
      "/admin/withdrawals?admin_id=" +
      encodeURIComponent(adminId);

    if (status) {
      url += "&status=" + encodeURIComponent(status);
    }

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok || !data.success) {
      list.innerHTML =
        "<div class='card'>❌ " +
        escapeHtml(data.error || "Server Error") +
        "</div>";
      return;
    }

    if (!data.withdrawals || data.withdrawals.length === 0) {
      list.innerHTML =
        "<div class='card'>📭 কোনো Withdrawal পাওয়া যায়নি।</div>";
      return;
    }

    list.innerHTML = data.withdrawals.map(w => {

      const isPending = w.status === "pending";

      return `
        <div class="card" style="margin-top:8px;">

          <b>💸 Withdrawal #${escapeHtml(w.id)}</b>

          <p>
            🆔 User ID:
            ${escapeHtml(w.user_id)}
          </p>

          <p>
            🪙 Amount:
            <b>${escapeHtml(w.amount)} Coins</b>
          </p>

          <p>
            💳 Method:
            ${escapeHtml(String(w.method).toUpperCase())}
          </p>

          <p>
            📱 Number:
            <b>${escapeHtml(w.number)}</b>
          </p>

          <p>
            📌 Status:
            <b>${escapeHtml(w.status)}</b>
          </p>

          <small>
            🕒 Created:
            ${escapeHtml(w.created_at || "")}
          </small>

          ${
            w.updated_at
            ?
            `<br><small>
              🔄 Updated:
              ${escapeHtml(w.updated_at)}
            </small>`
            :
            ""
          }

          ${
            isPending
            ?
            `
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">

                <button
                  type="button"
                  onclick="updateWithdrawal(${Number(w.id)}, 'approved')"
                >
                  ✅ Approve
                </button>

                <button
                  type="button"
                  onclick="updateWithdrawal(${Number(w.id)}, 'rejected')"
                >
                  ❌ Reject
                </button>

              </div>
            `
            :
            ""
          }

        </div>
      `;

    }).join("");

  } catch (error) {

    console.error("Withdrawal load error:", error);

    list.innerHTML =
      "<div class='card'>❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।</div>";
  }
}


async function updatePendingWithdrawalCount() {
  const adminId = document.getElementById("adminId").value.trim();
  const badge = document.getElementById("pendingWithdrawalBadge");

  if (adminId !== "7136507076" || !badge) {
    return;
  }

  try {
    const response = await fetch(
      API +
      "/admin/withdrawals?admin_id=" +
      encodeURIComponent(adminId) +
      "&status=pending"
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      return;
    }

    const count = Array.isArray(data.withdrawals)
      ? data.withdrawals.length
      : 0;

    if (count > 0) {
      badge.textContent = count + " Pending";
      badge.style.display = "inline-block";
    } else {
      badge.textContent = "0 Pending";
      badge.style.display = "none";
    }

  } catch (error) {
    console.error("Pending count error:", error);
  }
}

setInterval(updatePendingWithdrawalCount, 5000);


async function updateWithdrawal(withdrawalId, status) {

  const adminId = document.getElementById("adminId").value.trim();

  if (adminId !== "7136507076") {
    alert("❌ Admin Login করুন");
    return;
  }

  const actionText =
    status === "approved" ? "Approve" : "Reject";

  if (!confirm(
    "⚠️ আপনি কি Withdrawal #" +
    withdrawalId +
    " " +
    actionText +
    " করতে চান?"
  )) {
    return;
  }

  try {

    const response = await fetch(
      API + "/admin/withdrawal/status",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          admin_id: Number(adminId),
          withdrawal_id: Number(withdrawalId),
          status: status
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {

      alert(
        "❌ Status update করা যায়নি.\n" +
        (data.error || "Unknown error")
      );

      return;
    }

    alert(
      status === "approved"
      ? "✅ Withdrawal Approved!"
      : "❌ Withdrawal Rejected এবং Coins Refund হয়েছে।"
    );

    loadWithdrawals("pending");
    updatePendingWithdrawalCount();

  } catch (error) {

    console.error("Withdrawal update error:", error);

    alert(
      "❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না।"
    );
  }
}
</script>


<div class="card" style="margin-top:15px;">
  <h3>🪙 Add Coins</h3>

  <input
    id="testCoinUid"
    type="text"
    placeholder="TaskMoon UID (e.g. TM572635)"
    style="width:100%;padding:10px;margin:6px 0;"
  >

  <input
    id="testCoinUserId"
    type="number"
    placeholder="অথবা Telegram User ID"
    style="width:100%;padding:10px;margin:6px 0;"
  >

  <input
    id="testCoinAmount"
    type="number"
    placeholder="Coins"
    min="1"
    style="width:100%;padding:10px;margin:6px 0;"
  >

  <button class="btn" onclick="addTestCoins()">
    ➕ Add Coins
  </button>

  <div id="testCoinResult" style="margin-top:10px;"></div>
</div>

<script>
async function addTestCoins() {
  const uid = document.getElementById("testCoinUid").value.trim();
  const userId = Number(document.getElementById("testCoinUserId").value);
  const amount = Number(document.getElementById("testCoinAmount").value);
  const result = document.getElementById("testCoinResult");

  if (!uid && !userId) {
    result.textContent = "❌ UID অথবা Telegram User ID দিন";
    return;
  }

  if (!Number.isInteger(amount) || amount <= 0) {
    result.textContent = "❌ Coins সঠিকভাবে দিন";
    return;
  }

  if (!currentAdminId || String(currentAdminId) !== "7136507076") {
    result.textContent = "❌ Admin Login করুন";
    return;
  }

  result.textContent = "⏳ Adding coins...";

  try {
    const body = {
      admin_id: 7136507076,
      amount: amount
    };

    if (uid) {
      body.uid = uid;
    } else {
      body.user_id = userId;
    }

    const response = await fetch(
      API + "/admin/add-coins?t=" + Date.now(),
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      result.textContent =
        "❌ " + (data.error || "Coin add failed");
      return;
    }

    result.textContent =
      "✅ Added " + data.added_coins +
      " coins. Current balance: " +
      data.user_coins + " Coins";

    document.getElementById("testCoinAmount").value = "";

  } catch (error) {
    console.error("Add coins error:", error);
    result.textContent =
      "❌ Server-এর সাথে যোগাযোগ করা যাচ্ছে না";
  }
}

</script>


<!-- TASK SUBMISSIONS -->
<div class="card" style="margin-top:20px;">
  <h2>📋 Task Submissions</h2>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
    <button onclick="loadTaskSubmissions('pending')">⏳ Pending</button>
    <button onclick="loadTaskSubmissions('approved')">✅ Approved</button>
    <button onclick="loadTaskSubmissions('rejected')">❌ Rejected</button>
    <button onclick="loadTaskSubmissions()">📋 All</button>
  </div>

  <div id="taskSubmissionList">Loading...</div>
</div>

<script>
async function loadTaskSubmissions(status="pending") {
  const box = document.getElementById("taskSubmissionList");
  box.innerHTML = "⏳ Loading...";

  try {
    let url = API + "/admin/task-submissions?admin_id=" +
      encodeURIComponent(ADMIN_ID);

    if (status) url += "&status=" + encodeURIComponent(status);

    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok) {
      box.innerHTML = "❌ " + (data.error || "Failed");
      return;
    }

    if (!data.submissions || data.submissions.length === 0) {
      box.innerHTML = "📭 No submissions found";
      return;
    }

    box.innerHTML = data.submissions.map(row => `
      <div style="border:1px solid #444;border-radius:12px;padding:14px;margin-bottom:12px;">
        <b>🔢 #${row.serial}</b>
        <p>📝 <b>${escapeHtml(row.task_title)}</b></p>
        <p>👤 User ID: ${row.user_id}</p>
        <p>🪙 Reward: ${row.reward}</p>
        <p>📎 Proof:<br>
          <span style="word-break:break-all;">${escapeHtml(row.proof || "N/A")}</span>
        </p>
        <p>💬 Note: ${escapeHtml(row.note || "N/A")}</p>
        <p>📌 Status: <b>${escapeHtml(row.status)}</b></p>
        <small>🕒 ${escapeHtml(row.created_at || "")}</small>

        ${row.status === "pending" ? `
          <div style="margin-top:10px;display:flex;gap:8px;">
            <button onclick="updateTaskSubmission(${row.id},'approved')">
              ✅ Approve
            </button>
            <button onclick="updateTaskSubmission(${row.id},'rejected')">
              ❌ Reject
            </button>
          </div>
        ` : ""}
      </div>
    `).join("");

  } catch (e) {
    box.innerHTML = "❌ Network error";
  }
}

async function updateTaskSubmission(id, status) {
  if (!confirm(status === "approved"
      ? "Approve this submission?"
      : "Reject this submission?")) return;

  try {
    const res = await fetch(API + "/admin/task-submission/status", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        admin_id: Number(ADMIN_ID),
        submission_id: id,
        status: status
      })
    });

    const data = await res.json();

    if (!res.ok) {
      alert("❌ " + (data.error || "Failed"));
      return;
    }

    alert(status === "approved"
      ? "✅ Approved & reward added"
      : "❌ Submission rejected");

    loadTaskSubmissions("pending");

  } catch (e) {
    alert("❌ Network error");
  }
}

</script>

</body>
</html>
